services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: trustattendance-backend:latest
    container_name: trustattendance-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    networks:
      - trustattendance-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: trustattendance-frontend:latest
    container_name: trustattendance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trustattendance-net

networks:
  trustattendance-net:
    driver: bridge
